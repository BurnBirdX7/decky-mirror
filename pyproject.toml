[project]
name = "decky-mirror"
version = "0.1.0"
description = "Minimal Decky store mirror server skeleton"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp>=3.14.4,<4",
    "fastapi",
    "python-dotenv>=1.2.4",
    "uvicorn",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]

