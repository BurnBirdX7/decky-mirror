[project]
name = "decky-proxy"
version = "0.2.1"
description = "Minimal Decky store proxy server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp>=3.14.4,<4",
    "fastapi",
    "python-dotenv>=1.2.4",
    "slowapi>=0.1.10,<0.2",
    "uvicorn",
]

[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "decky_proxy"
module-root = ""

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
